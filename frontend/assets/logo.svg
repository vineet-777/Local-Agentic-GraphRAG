<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="violetGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10a37f" />
    </linearGradient>
    <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#10a37f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="32" fill="url(#coreLight)" />

  <!-- Outer Quantum Hexagonal Ring -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" 
           stroke="url(#primaryGlow)" stroke-width="2.5" stroke-linejoin="round" 
           fill="none" filter="url(#glowFilter)" opacity="0.9"/>

  <!-- Inner Inverted Hexagon -->
  <polygon points="50,22 75,36 75,64 50,78 25,64 25,36" 
           stroke="url(#violetGlow)" stroke-width="1.8" stroke-linejoin="round" 
           stroke-dasharray="4 2" fill="none" opacity="0.75"/>

  <!-- Knowledge Graph Neural Interconnections (Edges) -->
  <line x1="50" y1="10" x2="50" y2="50" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.8"/>
  <line x1="85" y1="30" x2="50" y2="50" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.8"/>
  <line x1="85" y1="70" x2="50" y2="50" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.8"/>
  <line x1="50" y1="90" x2="50" y2="50" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.8"/>
  <line x1="15" y1="70" x2="50" y2="50" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.8"/>
  <line x1="15" y1="30" x2="50" y2="50" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.8"/>

  <!-- Secondary Cross-Hop Graph Edges -->
  <line x1="50" y1="22" x2="75" y2="64" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="75" y1="36" x2="25" y2="64" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  <line x1="25" y1="36" x2="50" y2="78" stroke="#10a37f" stroke-width="1" opacity="0.5"/>

  <!-- Graph Entity Nodes (Vertices) -->
  <circle cx="50" cy="10" r="3.5" fill="#10a37f" />
  <circle cx="85" cy="30" r="3.5" fill="#06b6d4" />
  <circle cx="85" cy="70" r="3.5" fill="#a855f7" />
  <circle cx="50" cy="90" r="3.5" fill="#10a37f" />
  <circle cx="15" cy="70" r="3.5" fill="#06b6d4" />
  <circle cx="15" cy="30" r="3.5" fill="#a855f7" />

  <!-- Inner Nodes -->
  <circle cx="50" cy="22" r="2.5" fill="#ffffff" />
  <circle cx="75" cy="36" r="2.5" fill="#38bdf8" />
  <circle cx="75" cy="64" r="2.5" fill="#c084fc" />
  <circle cx="50" cy="78" r="2.5" fill="#34d399" />
  <circle cx="25" cy="64" r="2.5" fill="#38bdf8" />
  <circle cx="25" cy="36" r="2.5" fill="#c084fc" />

  <!-- Central Agentic Synthesis Core -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" filter="url(#glowFilter)"/>
  <circle cx="50" cy="50" r="3" fill="#10a37f" />
</svg>
